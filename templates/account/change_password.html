{# templates/account/change_password.html #}
{% extends "base.html" %}
{% block body %}
<div class="min-h-screen bg-slate-50 py-10 px-4">
  <div class="max-w-md mx-auto">
    <div class="bg-white rounded-2xl border border-slate-100 p-6 sm:p-8">
      <h1 class="text-2xl font-extrabold">Change password</h1>

      {% if is_temp %}
        <div class="mt-4 rounded-xl bg-amber-50 border border-amber-200 p-3 text-sm text-amber-800">
          You're using a temporary password. Please set a new one to continue.
        </div>
      {% endif %}

      <form method="POST" class="mt-6 space-y-4">
        {% if not is_temp %}
        <div>
          <label class="text-sm font-semibold text-slate-700">Current password</label>
          <input type="password" name="current_password" required autofocus
                 class="mt-2 w-full px-4 py-3 rounded-xl border border-slate-200
                        focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10 outline-none">
        </div>
        {% endif %}

        <div>
          <label class="text-sm font-semibold text-slate-700">New password</label>
          <input type="password" name="new_password" required minlength="8"
                 {% if is_temp %}autofocus{% endif %}
                 class="mt-2 w-full px-4 py-3 rounded-xl border border-slate-200
                        focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10 outline-none">
        </div>

        <div>
          <label class="text-sm font-semibold text-slate-700">Confirm new password</label>
          <input type="password" name="confirm_password" required minlength="8"
                 class="mt-2 w-full px-4 py-3 rounded-xl border border-slate-200
                        focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10 outline-none">
        </div>

        <button class="w-full py-3 rounded-xl bg-brand-600 hover:bg-brand-700
                       text-white font-semibold">
          Update password
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
