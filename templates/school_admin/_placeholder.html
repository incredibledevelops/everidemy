{% extends "school_admin/base.html" %}
{% block page_title %}{{ title }}{% endblock %}
{% block breadcrumb %}{{ title }}{% endblock %}

{% block content %}
<div class="bg-white rounded-2xl border border-slate-100 p-10 sm:p-16 text-center max-w-2xl mx-auto">
  <div class="w-20 h-20 mx-auto rounded-2xl bg-brand-50 grid place-items-center text-brand-600 text-4xl">
    {{ icon }}
  </div>
  <h2 class="mt-6 text-2xl font-extrabold">{{ title }}</h2>
  <p class="mt-3 text-slate-500">{{ description }}</p>
  <div class="mt-8 inline-flex items-center gap-2 text-xs font-semibold uppercase tracking-wider
              text-amber-700 bg-amber-50 border border-amber-200 px-3 py-1.5 rounded-full">
    🚧 Coming soon
  </div>
  <div class="mt-8">
    <a href="{{ url_for('school_admin.dashboard') }}"
       class="inline-flex px-5 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-700
              text-white font-semibold text-sm">
      ← Back to dashboard
    </a>
  </div>
</div>
{% endblock %}
