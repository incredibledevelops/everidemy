{# templates/_marketing_footer.html #}
<footer class="bg-white border-t border-slate-100">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 grid sm:grid-cols-2 md:grid-cols-4 gap-8 text-sm">

    <!-- Brand -->
    <div class="sm:col-span-2 md:col-span-1">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-brand-600 grid place-items-center
                    text-white font-bold" aria-hidden="true">
          E
        </div>
        <span class="font-extrabold">{{ platform_name }}</span>
      </div>
      <p class="mt-3 text-slate-500">
        Modern school management for African schools.
      </p>
    </div>

    <!-- Product -->
    <div>
      <p class="font-semibold">Product</p>
      <ul class="mt-3 space-y-2 text-slate-500">
        <li>
          <a href="{{ url_for('main.features') }}" class="hover:text-brand-600">
            Features
          </a>
        </li>
        <li>
          <a href="{{ url_for('main.pricing') }}" class="hover:text-brand-600">
            Pricing
          </a>
        </li>
      </ul>
    </div>

    <!-- Company -->
    <div>
      <p class="font-semibold">Company</p>
      <ul class="mt-3 space-y-2 text-slate-500">
        <li>
          <a href="{{ url_for('main.about') }}" class="hover:text-brand-600">
            About
          </a>
        </li>
        <li>
          <a href="{{ url_for('main.contact') }}" class="hover:text-brand-600">
            Contact
          </a>
        </li>
      </ul>
    </div>

    <!-- Legal + contact -->
    <div>
      <p class="font-semibold">Legal</p>
      <ul class="mt-3 space-y-2 text-slate-500">
        <li>
          <a href="{{ url_for('main.contact') }}#privacy"
             class="hover:text-brand-600">Privacy</a>
        </li>
        <li>
          <a href="{{ url_for('main.contact') }}#terms"
             class="hover:text-brand-600">Terms</a>
        </li>
      </ul>
    </div>
  </div>

  <!-- Bottom row -->
  <div class="border-t border-slate-100 py-6">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8
                flex flex-col sm:flex-row items-center justify-between gap-3
                text-xs text-slate-500">
      <p>© {{ now.year }} {{ platform_name }}. All rights reserved.</p>
      <p>
        <a href="mailto:support@everidemy.com" class="hover:text-brand-600">
          support@everidemy.com
        </a>
      </p>
    </div>
  </div>
</footer>
