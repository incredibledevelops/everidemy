{% extends "base.html" %}
{% block body %}
<div class="min-h-screen flex items-center justify-center bg-slate-50 p-6">
  <div class="w-full max-w-md bg-white rounded-2xl border border-slate-100 p-8 shadow-sm">
    <h1 class="text-2xl font-extrabold">Forgot password?</h1>
    <p class="text-sm text-slate-500 mt-1">
      Enter your email and we'll send you a reset link.
    </p>
    <form method="POST" class="mt-6 space-y-4">
      <div>
        <label class="text-sm font-semibold text-slate-700">Email</label>
        <input type="email" name="email" required autofocus
               class="mt-2 w-full px-4 py-3 rounded-xl border border-slate-200
                      focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10 outline-none">
      </div>
      <button class="w-full py-3 rounded-xl bg-brand-600 hover:bg-brand-700
                     text-white font-semibold">
        Send reset link
      </button>
    </form>
    <p class="mt-6 text-center text-sm">
      <a href="{{ url_for('auth.login') }}" class="text-brand-600 font-semibold hover:underline">
        ← Back to login
      </a>
    </p>
  </div>
</div>
{% endblock %}
