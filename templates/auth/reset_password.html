{% extends "base.html" %}
{% block body %}
<div class="min-h-screen flex items-center justify-center bg-slate-50 p-6">
  <div class="w-full max-w-md bg-white rounded-2xl border border-slate-100 p-8 shadow-sm">
    <h1 class="text-2xl font-extrabold">Choose a new password</h1>
    <p class="text-sm text-slate-500 mt-1">Minimum 8 characters.</p>
    <form method="POST" class="mt-6 space-y-4">
      <div>
        <label class="text-sm font-semibold text-slate-700">New password</label>
        <input type="password" name="password" required minlength="8" autofocus
               class="mt-2 w-full px-4 py-3 rounded-xl border border-slate-200
                      focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10 outline-none">
      </div>
      <div>
        <label class="text-sm font-semibold text-slate-700">Confirm password</label>
        <input type="password" name="confirm_password" required minlength="8"
               class="mt-2 w-full px-4 py-3 rounded-xl border border-slate-200
                      focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10 outline-none">
      </div>
      <button class="w-full py-3 rounded-xl bg-brand-600 hover:bg-brand-700
                     text-white font-semibold">
        Set new password
      </button>
    </form>
  </div>
</div>
{% endblock %}
