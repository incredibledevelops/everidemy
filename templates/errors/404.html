{% extends "base.html" %}
{% block title %}Not found{% endblock %}
{% block body %}
<div class="min-h-screen grid place-items-center px-4">
  <div class="text-center max-w-md">
    <p class="text-7xl font-extrabold text-brand-600">404</p>
    <h1 class="mt-4 text-2xl font-bold">Page not found</h1>
    <p class="mt-2 text-slate-500">The page you're looking for doesn't exist or has moved.</p>
    <a href="{{ url_for('main.landing') }}"

      Back to home
    </a>
  </div>
</div>
{% endblock %}
